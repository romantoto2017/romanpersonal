# Configuración para publicar en Netlify (gratis).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# La app usa rutas con # así que no hace falta redirigir nada,
# pero dejamos el fallback por las dudas.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# El service worker y el manifest nunca se cachean "para siempre":
# así las actualizaciones te llegan enseguida.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fuentes/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
